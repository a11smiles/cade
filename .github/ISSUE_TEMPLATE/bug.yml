name: Bug report
description: Something in CADE is broken or wrong.
title: "[Bug] "
labels: ["bug", "needs-triage", "type:bug"]
body:
  - type: markdown
    attributes:
      value: |
        You can also file this from inside CADE (Help › Send feedback); it fills in your environment for you.
        Don't paste prompts, designs or file paths you can't share publicly.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open an App project
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: false
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
  - type: dropdown
    id: output
    attributes:
      label: Output type
      multiple: true
      options: [App, Image, Deck, Document, Motion, Diagram, Architecture, Data model, System, Other]
  - type: input
    id: area
    attributes:
      label: Area
  - type: input
    id: severity
    attributes:
      label: Severity
  - type: input
    id: app_version
    attributes:
      label: CADE version
      placeholder: "0.1.0 (abc1234)"
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Windows, Linux]
  - type: input
    id: gpu
    attributes:
      label: GPU and renderer
  - type: input
    id: policy_version
    attributes:
      label: Policy version
  - type: input
    id: screenshot_url
    attributes:
      label: Screenshot URL
