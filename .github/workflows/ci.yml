name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  crates:
    name: Crates (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Rust
        run: rustup show
      - name: Linux font libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --exclude cade-app --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --exclude cade-app
  app:
    name: App (${{ matrix.os }})
    needs: crates
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Linux webview libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libsecret-1-dev
      - name: UI
        run: pnpm --dir app/ui install --frozen-lockfile=false && pnpm --dir app/ui build
      - name: UI typecheck (including e2e)
        run: pnpm --dir app/ui typecheck
      - name: UI tests
        run: pnpm --dir app/ui test
      - name: App
        run: cargo build -p cade-app
      - name: App IPC tests
        run: cargo test -p cade-app
  e2e:
    name: UI end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install
        run: pnpm --dir app/ui install --frozen-lockfile=false && pnpm --dir app/ui exec playwright install --with-deps chromium
      - name: Playwright
        run: pnpm --dir app/ui test:e2e
      - name: Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            app/ui/playwright-report/
            app/ui/test-results/
