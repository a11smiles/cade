name: Labels
on:
  push:
    branches: [main]
    paths: [.github/labels.yml]
  workflow_dispatch:
permissions:
  issues: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync labels
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          python3 - <<'PY'
          import re, subprocess
          for line in open('.github/labels.yml'):
              m = re.match(r'- \{ name: ([\w-]+),\s*color: "(\w+)", description: "([^"]+)" \}', line.strip())
              if m:
                  n, c, d = m.groups()
                  subprocess.run(['gh', 'label', 'create', n, '--color', c, '--description', d, '--force'], check=True)
          PY
